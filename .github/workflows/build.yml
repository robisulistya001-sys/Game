name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Extract project.zip (kalau ada)
        run: |
          if [ -f "project.zip" ]; then
            unzip -o project.zip -d .
            echo "project.zip berhasil di-extract"
          else
            echo "project.zip tidak ditemukan, lanjut pakai file yang sudah ada di repo"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK Debug
        run: gradle assembleDebug

      - name: Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: RecapScanner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
